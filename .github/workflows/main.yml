python-dotenv==1.0.0 #!/usr/bin/env python3
import os, json, logging
from datetime import datetime
from langchain_openai import ChatOpenAI

logging.basicConfig(level=logging.INFO, handlers=[logging.FileHandler('logs/agent.log'), logging.StreamHandler()])
logger = logging.getLogger(__name__)

class TradingAgent:
    def __init__(self, market, strategy):
        self.market = market
        self.strategy = strategy
        self.llm = ChatOpenAI(model='gpt-4o', api_key=os.getenv('OPENAI_API_KEY'), temperature=0.1)
        logger.info(f"Initialized Trading Agent - {market} ({strategy})")
    
    def run(self):
        logger.info("Starting Trading Agent")
        market_data = {"market": self.market, "timestamp": datetime.now().isoformat()}
        
        response = self.llm.invoke(f"Analyze market {self.market} using {self.strategy} strategy. Provide BUY/SELL/HOLD.")
        
        results = {
            "timestamp": datetime.now().isoformat(),
            "market": self.market,
            "strategy": self.strategy,
            "analysis": response.content,
            "status": "success"
        }
        
        os.makedirs('logs', exist_ok=True)
        with open('logs/results.json', 'w') as f:
            json.dump(results, f, indent=2)
        
        logger.info("Trading Agent completed")
        return results

if __name__ == '__main__':
    import argparse
    parser = argparse.ArgumentParser()
    parser.add_argument('--market', default='stocks')
    parser.add_argument('--strategy', default='momentum')
    args = parser.parse_args()
    
    agent = TradingAgent(args.market, args.strategy)
    agent.run()
